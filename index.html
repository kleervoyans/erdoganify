<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heidelberg DESFire Card Inspector</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <h1 class="title">Heidelberg DESFire Inspector</h1>
        <p class="tagline">
          Analyze Flipper Zero NFC dumps for Uni Heidelberg style MIFARE DESFire EV1 cards.
        </p>
      </header>

      <section class="controls card">
        <label class="field-label" for="dumpInput">Paste dump text or raw hex bytes</label>
        <textarea
          id="dumpInput"
          spellcheck="false"
          placeholder="Example:\nUID: 04 7A 1B 2C 6F 22 80\nATQA: 03 44\nSAK: 20\nATS: 75 77 81 02 80"
        ></textarea>

        <div class="button-row">
          <button id="analyzeButton" class="button">Analyze card</button>
          <button id="loadSampleButton" class="button muted">Load sample</button>
          <button id="clearButton" class="button muted">Clear</button>
        </div>
      </section>

      <section class="card results" id="resultPanel">
        <h2>Result</h2>
        <p class="status" id="statusMessage">Paste a dump and run analysis.</p>
        <div id="resultContent" class="result-content"></div>
      </section>

      <footer class="app-footer">
        <p>
          Starter implementation for building a Heidelberg-focused card reader workflow on top of DESFire EV1 metadata.
        </p>
      </footer>
    </main>

    <script src="script.js"></script>
  </body>
</html>
